                  }, lp(0, -2, 1f, 4))
                  val ok = Sh.ok
                  val via = if (Sh.root) "Root" else "Shizuku"
                  row.addView(tile(if (ok) c("#1B5E20") else c("#7F1D1D"), if (ok) "check" else "cross", if (ok) c("#A5D6A7") else c("#FF8A80"),
                      t("Akses Shizuku/Root|Shizuku/Root access"),
                      if (ok) "$via • " + t("Diperoleh|Granted") else t("Belum aktif|Not active"),
                      if (ok) c("#66BB6A") else c("#EF5350")) {
                      if (!Sh.ok) {
                          try {
                              if (Shizuku.pingBinder()) Shizuku.requestPermission(1)
                              else toast(t("Nyalakan Shizuku atau berikan akses root|Start Shizuku or grant root"))
                          } catch (e: Throwable) { toast(t("Nyalakan Shizuku atau berikan akses root|Start Shizuku or grant root")) }
                      }
                  }, lp(0, -2, 1f, 4))
                  put(row)

                  val info = vbox(P.card, 14, 24)
                  val ih = hbox()
                  ih.addView(badge("info", P.inner, P.acc, 40, 20), lp(dp(40), dp(40)))
                  ih.addView(tv(t("Info perangkat|Device info"), 17f), lp(-2, -2).apply { leftMargin = dp(12) })
                  info.addView(ih)
                  val bi = registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                  val lvl = bi?.getIntExtra("level", 0) ?: 0
                  val tmp = (bi?.getIntExtra("temperature", 0) ?: 0) / 10.0
                  fun box(l: String, v: String) = vbox(P.inner, 12, 16).apply { addView(tv(l, 12f, P.sub)); addView(tv(v, 14f, P.txt, true)) }
                  val r1 = LinearLayout(this@MainActivity); val r2 = LinearLayout(this@MainActivity)
                  r1.addView(box(t("Nama perangkat|Device name"), Build.MANUFACTURER.replaceFirstChar { it.uppercase() } + " " + Build.MODEL), lp(0, -2, 1f, 4))
                  r1.addView(box(t("Versi Android|Android version"), "Android ${Build.VERSION.RELEASE} (API ${Build.VERSION.SDK_INT})"), lp(0, -2, 1f, 4))
                  r2.addView(box("Chipset", chipset()), lp(0, -2, 1f, 4))
                  r2.addView(box(t("Suhu & baterai|Temp & battery"), "$tmp°C • $lvl%"), lp(0, -2, 1f, 4))
                  info.addView(r1, lp().apply { topMargin = dp(10) })
                  info.addView(r2)
                  put(info)
              }

              // ---------- APPS ----------
              fun apps(): View {
                  val col = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(16), dp(48), dp(16), 0) }
                  col.addView(tv(t("Daftar aplikasi|App list"), 28f, P.txt, true))
                  val et = edit(t("Cari aplikasi...|Search apps..."))
                  col.addView(et, lp().apply { topMargin = dp(10); bottomMargin = dp(10) })
                  val lv = ListView(this).apply { divider = null; setPadding(0, 0, 0, dp(110)); clipToPadding = false }
                  col.addView(lv, lp(-1, 0, 1f))
                  var all = listOf<AppI>()
                  var shown = listOf<AppI>()
                  val green = c("#4CAF50"); val red = c("#EF5350"); val blue = c("#7986CB")
                  val ad = object : BaseAdapter() {
                      override fun getCount() = shown.size
                      override fun getItem(i: Int) = shown[i]
                      override fun getItemId(i: Int) = i.toLong()
                      override fun getView(i: Int, cv: View?, p: ViewGroup?): View {
                          val a = shown[i]
                          val en = enSet().contains(a.pkg)
                          val r = hbox().apply { background = bg(P.card, 16); setPadding(dp(14), dp(12), dp(14), dp(12)) }
                          val ic = ImageView(this@MainActivity)
                          var d = icons.get(a.pkg)
                          if (d == null) { d = try { packageManager.getApplicationIcon(a.pkg) } catch (e: Exception) { null }; if (d != null) icons.put(a.pkg, d) }
                          ic.setImageDrawable(d)
                          r.addView(ic, lp(dp(46), dp(46)))
                          val tx = LinearLayout(this@MainActivity).apply { orientation = LinearLayout.VERTICAL }
                          tx.addView(tv(a.label, 16f, P.txt, true).apply { isSingleLine = true })
                          tx.addView(tv(a.pkg, 12f, P.sub).apply { isSingleLine = true })
                          val cr = hbox()
                          cr.addView(chip(if (en) t("Diaktifkan|Enabled") else t("Dinonaktifkan|Disabled"), if (en) green else red), lp(-2, -2).apply { rightMargin = dp(8) })
                          if (a.game) cr.addView(chip(t("Direkomendasikan|Recommended"), blue))
                          tx.addView(cr, lp().apply { topMargin = dp(6) })
                          r.addView(tx, lp(0, -2, 1f).apply { leftMargin = dp(14) })
                          r.setOnClickListener {
                              val s = enSet(); if (!s.add(a.pkg)) s.remove(a.pkg)
                              sp.edit().putStringSet("en", s).apply(); notifyDataSetChanged()
                          }
                          return LinearLayout(this@MainActivity).apply { setPadding(0, 0, 0, dp(6)); addView(r, lp()) }
                      }
                  }
                  lv.adapter = ad
                  et.onText { q ->
                      shown = all.filter { it.label.contains(q, true) || it.pkg.contains(q, true) }
                      ad.notifyDataSetChanged()
                  }
                  Thread {
                      val pm = packageManager
                      val l = pm.getInstalledApplications(0).map { AppI(it.loadLabel(pm).toString(), it.packageName, isGame(it)) }
                          .filter { it.pkg != packageName }
                          .sortedWith(compareByDescending<AppI> { it.game }.thenBy { it.label.lowercase() })
                      if (!sp.contains("en")) sp.edit().putStringSet("en", l.filter { it.game }.map { it.pkg }.toHashSet()).apply()
                      ui.post { all = l; shown = l; ad.notifyDataSetChanged() }
                  }.start()
                  return col
              }

              // ---------- FEATURES ----------
              fun feat(): View = scroll {
                  addView(tv(t("Fitur|Features"), 28f, P.txt, true))
                  put(sec(t("Pilih fitur|Choose feature")))
                  val sr = LinearLayout(this@MainActivity)
                  sr.addView(gradTile("pad", t("Grafik PC/MC|PC/MC Graphics"), "ANGLE · Smooth · Pixel", "#5B6CFF", "#9B5BFF") { sub = "gfx"; angle = 0; show(1) }, lp(0, -2, 1f, 4))
                  sr.addView(gradTile("scale", "Downscale", "0.1 – 0.9 · DPI auto", "#00B8A9", "#2D7DFF") { sub = "ds"; show(1) }, lp(0, -2, 1f, 4))
                  addView(sr)

                  val mode = sp.getInt("mode", 1)
                  val mb = LinearLayout(this@MainActivity)
                  for (m in 0..2) mb.addView(btn(mname(m), m == mode) { setMode(m); show() }, lp(0, -2, 1f, 3))
                  put(cardI("gauge", t("Mode|Mode"), mb))

                  @Suppress("DEPRECATION")
                  val rates = windowManager.defaultDisplay.supportedModes.map { Math.round(it.refreshRate) }.distinct().sorted()
                  val rv = rates.map { r -> btn("$r Hz") { cmd("settings put system min_refresh_rate $r; settings put system peak_refresh_rate $r", "$r Hz") } }.toMutableList()
                  rv.add(btn("Auto") { cmd("settings delete system min_refresh_rate; settings delete system peak_refresh_rate", "Auto") })
                  put(cardI("screen", t("Kunci layar Hz|Lock refresh rate"), hs(*rv.toTypedArray())))

                  put(cardI("dnd", t("Jangan ganggu|Do not disturb"),
                      swCard("dnd", t("Mode jangan ganggu|Do not disturb mode"), t("Bungkam notifikasi saat bermain|Silence notifications while gaming"), sp.getBoolean("dnd", false)) { v ->
                          cmd("cmd notification set_dnd " + if (v) "priority" else "off", "DND " + if (v) "ON" else "OFF") { ok -> if (ok) sp.edit().putBoolean("dnd", v).apply() else show() }
                      }))

                  fun anim(v: String) = "settings put global window_animation_scale $v; settings put global transition_animation_scale $v; settings put global animator_duration_scale $v"
                  put(cardI("play", t("Skala animasi|Animation scale"), hs(
                      btn(t("Mati|Off")) { cmd(anim("0")) }, btn("0.5x") { cmd(anim("0.5")) }, btn("1x") { cmd(anim("1")) })))

                  put(cardI("bolt", t("Hapus cache & boost|Clear cache & boost"),
                      actRow("trash", t("Hapus cache semua aplikasi|Clear all app cache"), t("Bersihkan cache seluruh aplikasi|Free the cache of every app")) { cmd("pm trim-caches 999G", t("Cache dihapus|Cache cleared")) },
                      actRow("bolt", t("Boost manual|Manual boost"), t("Bebaskan RAM sekarang|Free up RAM now")) { cmd(BOOST, "Boost OK") },
                      swCard("clock", t("Boost otomatis|Auto boost"), t("Berjalan tiap 15 menit|Runs every 15 minutes"), sp.getBoolean("auto", false)) { autoBoost(it) }))

                  val pct = tv("${sp.getInt("br", 50)}%", 14f, P.acc, true)
                  val sb = SeekBar(this@MainActivity).apply {
                      max = 17; progress = (sp.getInt("br", 50) - 15) / 5
                      progressTintList = android.content.res.ColorStateList.valueOf(P.acc)
                      thumbTintList = android.content.res.ColorStateList.valueOf(P.acc)
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar?, p: Int, u: Boolean) { pct.text = "${p * 5 + 15}%" }
                          override fun onStartTrackingTouch(s: SeekBar?) {}
                          override fun onStopTrackingTouch(s: SeekBar?) {
                              val v = progress * 5 + 15
                              sp.edit().putInt("br", v).apply()
                              cmd("settings put system screen_brightness_mode 0; settings put system screen_brightness ${v * 255 / 100}", "$v%")
                          }
                      })
                  }
                  put(cardI("sun", t("Kecerahan (15% - 100%)|Brightness (15% - 100%)"), pct, sb))

                  val pr = LinearLayout(this@MainActivity)
                  pr.addView(toggleTile("battery", t("Hemat daya|Battery saver"), "lp") { v, cb ->
                      cmd("settings put global low_power ${if (v) 1 else 0}", "Hemat daya " + if (v) "ON" else "OFF", cb)
                  }, lp(0, -2, 1f, 4))
                  pr.addView(toggleTile("clock", "Doze Mode", "doze") { v, cb ->
                      cmd(if (v) "dumpsys deviceidle force-idle" else "dumpsys deviceidle unforce", "Doze " + if (v) "ON" else "OFF", cb)
                  }, lp(0, -2, 1f, 4))
                  put(cardI("battery", t("Mode hemat daya|Power saving"), pr))

                  val rec = tv("...", 13f, P.sub)
                  val ew = edit(t("Lebar|Width")).apply { inputType = InputType.TYPE_CLASS_NUMBER }
                  val eh = edit(t("Tinggi|Height")).apply { inputType = InputType.TYPE_CLASS_NUMBER }
                  var rw = 0; var rh = 0
                  loadPhys {
                      val mi = ActivityManager.MemoryInfo()
                      (getSystemService(ACTIVITY_SERVICE) as ActivityManager).getMemoryInfo(mi)
                      val gb = mi.totalMem / 1e9
                      val f = when { gb <= 3 -> 0.7; gb <= 4 -> 0.75; gb <= 6 -> 0.8; gb <= 8 -> 0.85; else -> 0.9 }
                      rw = (pw * f).toInt() / 2 * 2; rh = (ph * f).toInt() / 2 * 2
                      rec.text = "${t("Asli|Native")}: ${pw}x$ph • DPI $pd\n${t("Rekomendasi AI|AI recommendation")}: ${rw}x$rh (${(f * 100).toInt()}%) • RAM ${"%.1f".format(gb)} GB • ${chipset()}"
                  }
                  val er = LinearLayout(this@MainActivity)
                  er.addView(ew, lp(0, -2, 1f, 4)); er.addView(eh, lp(0, -2, 1f, 4))
                  val br = LinearLayout(this@MainActivity)
                  br.addView(btn(t("Terapkan|Apply"), true) {
                      val w = ew.text.toString().toIntOrNull(); val h = eh.text.toString().toIntOrNull()
                      if (w == null || h == null || w < 200 || h < 200) toast(t("Isi resolusi yang valid|Enter a valid resolution")) else applyRes(w, h)
                  }, lp(0, -2, 1f, 4))
                  br.addView(btn("Reset") { resetRes() }, lp(0, -2, 1f, 4))
                  put(cardI("scale", t("Resolusi custom|Custom resolution"), rec,
                      actRow("bolt", t("Pakai rekomendasi AI|Use AI recommendation"), t("Isi otomatis sesuai perangkat|Auto-fill for this device")) { if (rw > 0) { ew.setText("$rw"); eh.setText("$rh") } },
                      er, br))
              }

              // ---------- GRAPHICS ----------
              fun gfx(): View = scroll {
                  addView(back())
                  addView(tv(t("Grafik PC/MC|PC/MC Graphics"), 28f, P.txt, true), lp().apply { topMargin = dp(16) })
                  addView(tv(t("Atur render ANGLE untuk game target.|Tune ANGLE rendering for the target game."), 13f, P.sub))
                  if (angle == 0 && !angleBusy) {
                      angleBusy = true
                      ex.execute {
                          val t0 = System.currentTimeMillis()
                          val r = Sh.run("ls -d /system/*/*angle* /vendor/*/*angle* 2>/dev/null")
                          val w = 1200 - (System.currentTimeMillis() - t0)
                          if (w > 0) Thread.sleep(w)
                          ui.post { angleInfo = r; angle = if (r.isNotBlank() && !r.startsWith("ERR")) 1 else 2; angleBusy = false; if (sub == "gfx") show() }
                      }
                  }
                  val gc = c("#43A047"); val rc = c("#E53935")
                  val locked = angle != 1
                  val stc = vbox(P.card, 16, 24)
                  val sr = hbox()
                  val holder = FrameLayout(this@MainActivity)
                  if (angle == 0) holder.addView(Spin(this@MainActivity).apply { col = P.acc; start() }, FrameLayout.LayoutParams(dp(40), dp(40), Gravity.CENTER))
                  else {
                      val sc = if (angle == 1) gc else rc
                      holder.background = bg(tint(sc, 0x33), 24)
                      holder.addView(Ico(this@MainActivity, if (angle == 1) "check" else "cross", sc), FrameLayout.LayoutParams(dp(26), dp(26), Gravity.CENTER))
                  }
                  sr.addView(holder, lp(dp(48), dp(48)))
                  val tx = LinearLayout(this@MainActivity).apply { orientation = LinearLayout.VERTICAL }
                  tx.addView(tv(t("Dukungan ANGLE|ANGLE support"), 13f, P.sub))
                  tx.addView(tv(when (angle) { 0 -> t("Memeriksa...|Checking..."); 1 -> t("Support|Supported"); else -> t("Tidak support|Not supported") }, 18f, when (angle) { 0 -> P.txt; 1 -> gc; else -> rc }, true))
                  sr.addView(tx, lp(0, -2, 1f).apply { leftMargin = dp(14) })
                  if (angle != 0) {
                      val sc = if (angle == 1) gc else rc
                      sr.addView(tv(if (angle == 1) "SUPPORT" else t("TIDAK SUPPORT|UNSUPPORTED"), 11f, sc, true).apply {
                          setPadding(dp(10), dp(4), dp(10), dp(4)); background = bg(tint(sc, 0x2A), 50)
                      })
                  }
                  stc.addView(sr)
                  if (angle == 1) stc.addView(tv(angleInfo.lines().first().take(70), 11f, P.sub).apply { typeface = Typeface.MONOSPACE }, lp().apply { topMargin = dp(10) })
                  if (angle == 2) stc.addView(tv(t("Fitur dikunci karena perangkat ini tidak mendukung ANGLE.|Feature locked because this device does not support ANGLE."), 12f, rc), lp().apply { topMargin = dp(10) })
                  put(stc)

                  fun lockable(v: View): View {
                      if (locked) {
                          v.alpha = 0.4f
                          v.setOnClickListener { toast(if (angle == 0) t("Sedang memeriksa ANGLE...|Checking ANGLE...") else t("Fitur terkunci: ANGLE tidak didukung|Locked: ANGLE not supported")) }
                      }
                      return v
                  }
                  val pk = edit("package").apply { setText(sp.getString("tgt", "com.dts.freefiremax")); isEnabled = !locked; alpha = if (locked) 0.4f else 1f }
                  put(cardI("pad", t("Game target|Target game"), pk))
                  val cur = sp.getString("gfxm", "") ?: ""
                  fun doGfx(kind: String, extra: String) {
                      val p = pk.text.toString().trim()
                      if (p.isEmpty()) { toast("package?"); return }
                      cmd("settings put global angle_gl_driver_selection_pkgs $p && settings put global angle_gl_driver_selection_values angle && setprop debug.angle.feature_overrides_enabled $extra && am force-stop $p", kind) { ok ->
                          if (ok) { sp.edit().putString("tgt", p).putString("gfxm", kind).apply(); show() }
                      }
                  }
                  val hh = hbox()
                  hh.addView(sec(t("Mode grafik|Graphics mode")))
                  if (locked) hh.addView(Ico(this@MainActivity, "lock", rc), lp(dp(15), dp(15)).apply { leftMargin = dp(8) })
                  put(hh)
                  put(lockable(actRow("wave", "Smooth Graphics", t("Tekstur halus, anisotropic off, LOD +4|Smooth textures, anisotropic off, LOD +4"), cur == "smooth") {
                      doGfx("smooth", "disableAnisotropicFiltering:forceTextureLodOffset4")
                  }))
                  put(lockable(actRow("apps", "Pixel Graphics", t("Filter nearest bergaya pixel|Nearest filtering, pixel style"), cur == "pixel") {
                      doGfx("pixel", "forceNearestFiltering:disableAnisotropicFiltering:forceTextureLodOffset4")
                  }))
                  put(lockable(actRow("undo", "Restore Default", t("Kembalikan ke pengaturan bawaan|Back to default settings")) {
                      val p = pk.text.toString().trim()
                      cmd("settings delete global angle_gl_driver_selection_values && settings delete global angle_gl_driver_selection_pkgs && setprop debug.angle.feature_overrides_enabled \"\" && am force-stop $p", "Default") { ok ->
                          if (ok) { sp.edit().putString("gfxm", "").apply(); show() }
                      }
                  }))
                  put(actRow("check", t("Periksa ulang ANGLE|Re-check ANGLE"), t("Jalankan ulang pengecekan dukungan|Run the support check again")) { angle = 0; show() })
              }

              // ---------- DOWNSCALE ----------
              fun ds(): View = scroll {
                  addView(back())
                  addView(tv("Downscale", 28f, P.txt, true), lp().apply { topMargin = dp(16) })
                  addView(tv(t("Turunkan resolusi layar untuk FPS lebih stabil. DPI ikut menyesuaikan otomatis.|Lower the screen resolution for steadier FPS. DPI follows automatically."), 13f, P.sub))
                  var selN = sp.getInt("dsn", 8)
                  val mi = ActivityManager.MemoryInfo()
                  (getSystemService(ACTIVITY_SERVICE) as ActivityManager).getMemoryInfo(mi)
                  val gbm = mi.totalMem / 1e9
                  val recN = Math.round((when { gbm <= 3 -> 0.7; gbm <= 4 -> 0.75; gbm <= 6 -> 0.8; gbm <= 8 -> 0.85; else -> 0.9 }) * 10).toInt().coerceIn(1, 9)
                  val white = 0xCCFFFFFF.toInt()
                  val hero = vbox(P.card, 20, 28).apply {
                      background = GradientDrawable(GradientDrawable.Orientation.TL_BR, intArrayOf(c("#00B8A9"), c("#2D7DFF"))).apply { cornerRadius = dp(28).toFloat() }
                      elevation = dp(6).toFloat()
                  }
                  val hTop = hbox()
                  hTop.addView(tv(t("Resolusi hasil|Result resolution"), 13f, white), lp(0, -2, 1f))
                  hTop.addView(badge("scale", 0x33FFFFFF, Color.WHITE, 38, 20), lp(dp(38), dp(38)))
                  val big = tv("...", 34f, Color.WHITE, true)
                  val small = tv("", 13f, white)
                  hero.addView(hTop)
                  hero.addView(big, lp().apply { topMargin = dp(10) })
                  hero.addView(small, lp().apply { topMargin = dp(4) })
                  put(hero)
                  val boxes = ArrayList<LinearLayout>(); val mains = ArrayList<TextView>(); val subs = ArrayList<TextView>(); val ais = ArrayList<TextView>()
                  val warn = tv("", 12f, c("#E53935"))
                  fun resFor(n: Int): Triple<Int, Int, Int> {
                      val w = (pw * n / 10) / 2 * 2; val h = (ph * n / 10) / 2 * 2
                      return Triple(w, h, maxOf(72, if (pw > 0) pd * w / pw else 0))
                  }
                  fun refresh() {
                      if (pw == 0) { big.text = "..."; small.text = ""; return }
                      val (w, h, d) = resFor(selN)
                      big.text = "$w × $h"
                      small.text = "DPI $d · ${t("skala|scale")} 0.$selN×\n${t("Asli|Native")}: $pw × $ph · DPI $pd"
                      warn.text = if (selN <= 3) t("Skala sangat kecil, layar sulit dibaca. Otomatis kembali jika tidak disimpan.|Very small scale, the screen is hard to read. Reverts automatically if not kept.") else ""
                  }
                  fun paintAll() {
                      for (k in 0 until 9) {
                          val sel = (k + 1) == selN
                          boxes[k].background = bg(if (sel) P.acc else P.inner, 18)
                          mains[k].setTextColor(if (sel) P.onAcc else P.txt)
                          subs[k].setTextColor(if (sel) P.onAcc else P.sub)
                          ais[k].setTextColor(if (sel) P.onAcc else P.acc)
                      }
                  }
                  val rows = ArrayList<View>()
                  for (r in 0..2) {
                      val row = LinearLayout(this@MainActivity)
                      for (j in 1..3) {
                          val n = r * 3 + j
                          val box = vbox(P.inner, 12, 18)
                          val a = tv("0.$n", 22f, P.txt, true)
                          val b = tv(" ", 11f, P.sub)
                          val ai = chip("AI", P.acc).apply { visibility = if (n == recN) View.VISIBLE else View.INVISIBLE }
                          box.addView(a); box.addView(b); box.addView(ai, lp(-2, -2).apply { topMargin = dp(6) })
                          box.setOnClickListener { bounce(box); selN = n; paintAll(); refresh() }
                          boxes.add(box); mains.add(a); subs.add(b); ais.add(ai)
                          row.addView(box, lp(0, -2, 1f, 4))
                      }
                      rows.add(row)
                  }
                  put(cardI("scale", t("Pilih skala|Choose scale"), *rows.toTypedArray()))
                  addView(warn, lp().apply { topMargin = dp(8) })
                  paintAll()
                  loadPhys {
                      for (k in 0 until 9) { val (w, h, _) = resFor(k + 1); subs[k].text = "$w×$h" }
                      refresh(); paintAll()
                  }
                  put(actRow("play", t("Terapkan skala|Apply scale"), t("Resolusi dan DPI diubah sekaligus|Resolution and DPI change together"), true) {
                      if (pw > 0) { val (w, h, _) = resFor(selN); sp.edit().putInt("dsn", selN).apply(); applyRes(w, h) }
                  })
                  put(actRow("undo", "Reset", t("Kembali ke resolusi asli|Back to native resolution")) { resetRes() })
                  put(cardI("info", t("Tentang DPI otomatis|About auto DPI"),
                      tv(t("DPI dihitung dari skala yang dipilih supaya tampilan tetap proporsional. Setelah diterapkan, pilih Simpan dalam 15 detik atau pengaturan dikembalikan otomatis.|DPI is derived from the chosen scale to keep the layout proportional. After applying, choose Keep within 15 seconds or it reverts automatically."), 13f, P.sub)))
              }

              // ---------- SETTINGS ----------
              fun settings(): View = scroll {
                  addView(tv(t("Pengaturan|Settings"), 28f, P.txt, true))
                  val th = sp.getString("theme", "system")
                  fun thBtn(k: String, l: String) = btn(l, th == k) {
                      sp.edit().putString("theme", k).putInt("rt", 3).apply(); recreate()
                  }
                  put(cardI("sun", t("Tema warna|Color theme"), hs(thBtn("system", t("Sistem|System")), thBtn("light", "Light"), thBtn("dark", "Dark"))))
                  put(cardI("globe", t("Bahasa|Language"), hs(
                      btn("Indonesia", lang == "id") { lang = "id"; sp.edit().putString("lang", "id").apply(); show() },
                      btn("English", lang == "en") { lang = "en"; sp.edit().putString("lang", "en").apply(); show() })))
                  put(cardI("share", t("Sosial media|Social media"),
                      actRow("share", "TikTok", "@lutfikreji") { open("https://www.tiktok.com/@lutfikreji") },
                      actRow("share", t("Saluran WhatsApp|WhatsApp channel"), "WhatsApp") { open("https://whatsapp.com/channel/0029Vb8BjUO6WaKsAOUqWK0I") }))
                  put(cardI("info", t("Tentang|About"),
                      tv(t("Developer|Developer") + ": lutfikreji", 14f, P.sub),
                      tv(t("Versi aplikasi|App version") + ": 1.0.0", 14f, P.sub)))
              }
          }
          EOF

      - name: Build debug APK
        working-directory: zo
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp zo/app/build/outputs/apk/debug/app-debug.apk ZenithOptimizer-1.0.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ZenithOptimizer
          path: ZenithOptimizer-1.0.0.apk
