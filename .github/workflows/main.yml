              fun noAcc() = toast(t("Akses Shizuku/Root belum aktif|Shizuku/Root access not active"))
              fun loading(msg: String) {
                  ov?.let { rootL.removeView(it) }
                  val f = FrameLayout(this).apply { setBackgroundColor(0x99000000.toInt()); isClickable = true; alpha = 0f }
                  val card = vbox(P.card, 24, 28).apply { gravity = Gravity.CENTER_HORIZONTAL; elevation = dp(12).toFloat() }
                  val spn = Spin(this).apply { col = P.acc; okC = c("#43A047"); errC = c("#E53935"); start() }
                  card.addView(spn, lp(dp(64), dp(64)))
                  val tx = tv(msg, 14f, P.txt, true).apply { gravity = Gravity.CENTER }
                  card.addView(tx, lp(-2, -2).apply { topMargin = dp(14) })
                  f.addView(card, FrameLayout.LayoutParams(dp(220), -2, Gravity.CENTER))
                  rootL.addView(f, FrameLayout.LayoutParams(-1, -1))
                  f.animate().alpha(1f).setDuration(160).start()
                  card.scaleX = .9f; card.scaleY = .9f
                  card.animate().scaleX(1f).scaleY(1f).setDuration(240).setInterpolator(android.view.animation.OvershootInterpolator()).start()
                  ov = f; ovSpin = spn; ovTxt = tx
              }
              fun done(ok: Boolean, msg: String) {
                  val f = ov ?: return
                  ovSpin?.finish(ok); ovTxt?.text = msg
                  ui.postDelayed({ f.animate().alpha(0f).setDuration(220).withEndAction { rootL.removeView(f); if (ov === f) ov = null }.start() }, 900)
              }
              fun cmd(c: String, msg: String = "OK", after: (Boolean) -> Unit = {}) {
                  if (!Sh.ok) { noAcc(); return }
                  loading(t("Memproses...|Processing..."))
                  ex.execute {
                      val t0 = System.currentTimeMillis()
                      val r = Sh.run(c)
                      val ok = !r.startsWith("ERR") && !Regex("exception|denied|unknown command|not found|failed", RegexOption.IGNORE_CASE).containsMatchIn(r)
                      val w = 800 - (System.currentTimeMillis() - t0)
                      if (w > 0) Thread.sleep(w)
                      ui.post { done(ok, if (ok) msg else r.lines().first().take(60)); after(ok) }
                  }
              }
              fun mname(m: Int) = t(listOf("Hemat baterai|Battery saver", "Seimbang|Balanced", "Performa|Performance")[m])
              fun chipset(): String =
                  if (Build.VERSION.SDK_INT >= 31 && Build.SOC_MODEL.isNotBlank() && Build.SOC_MODEL != "unknown")
                      Build.SOC_MODEL else Build.HARDWARE
              fun isGame(ai: ApplicationInfo): Boolean {
                  @Suppress("DEPRECATION") val f = (ai.flags and ApplicationInfo.FLAG_IS_GAME) != 0
                  return f || ai.category == ApplicationInfo.CATEGORY_GAME
              }
              fun enSet(): MutableSet<String> = HashSet(sp.getStringSet("en", null) ?: emptySet())

              // ---------- actions ----------
              fun applyMode(m: Int) {
                  if (!Sh.ok) { noAcc(); return }
                  loading(t("Menerapkan mode...|Applying mode..."))
                  ex.execute {
                      val t0 = System.currentTimeMillis()
                      Sh.run(when (m) {
                          0 -> "settings put global low_power 1"
                          1 -> "settings put global low_power 0; cmd power set-fixed-performance-mode-enabled false"
                          else -> "settings put global low_power 0; cmd power set-fixed-performance-mode-enabled true"
                      })
                      if (Sh.root) {
                          val g = when (m) { 0 -> "powersave"; 1 -> "schedutil"; else -> "performance" }
                          val fb = if (m == 1) " || echo walt > \$c || echo interactive > \$c" else ""
                          Sh.run("for c in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do echo $g > \$c$fb; done")
                      }
                      val gm = when (m) { 0 -> "battery"; 1 -> "standard"; else -> "performance" }
                      enSet().forEach { Sh.run("cmd game mode $gm $it") }
                      val w = 800 - (System.currentTimeMillis() - t0)
                      if (w > 0) Thread.sleep(w)
                      ui.post { done(true, mname(m)) }
                  }
              }
              fun setMode(m: Int) { sp.edit().putInt("mode", m).apply(); applyMode(m) }
              fun autoBoost(on: Boolean) {
                  val js = getSystemService(JobScheduler::class.java)
                  if (on) js.schedule(JobInfo.Builder(1, ComponentName(this, BoostJob::class.java)).setPeriodic(15 * 60 * 1000L).build())
                  else js.cancel(1)
                  sp.edit().putBoolean("auto", on).apply()
              }
              fun loadPhys(done: () -> Unit) {
                  ex.execute {
                      val o = Sh.run("wm size; wm density")
                      val m = Regex("Physical size: (\\d+)x(\\d+)").find(o)
                      val d = Regex("Physical density: (\\d+)").find(o)
                      if (m != null && d != null) {
                          pw = m.groupValues[1].toInt(); ph = m.groupValues[2].toInt(); pd = d.groupValues[1].toInt()
                          sp.edit().putString("phys", "$pw,$ph,$pd").apply()
                      } else sp.getString("phys", null)?.split(",")?.let { pw = it[0].toInt(); ph = it[1].toInt(); pd = it[2].toInt() }
                      if (pw == 0) {
                          val dm = DisplayMetrics()
                          @Suppress("DEPRECATION") windowManager.defaultDisplay.getRealMetrics(dm)
                          pw = minOf(dm.widthPixels, dm.heightPixels); ph = maxOf(dm.widthPixels, dm.heightPixels); pd = dm.densityDpi
                      }
                      ui.post { done() }
                  }
              }
              fun applyRes(w: Int, h: Int) {
                  if (!Sh.ok) { noAcc(); return }
                  if (pw == 0) return
                  val d = maxOf(72, pd * w / pw)
                  cmd("wm size ${w}x$h; wm density $d", t("Resolusi diterapkan|Resolution applied")) { ok -> if (ok) ui.postDelayed({ confirmRevert() }, 1100) }
              }
              fun confirmRevert() {
                  val rev = Runnable {
                      ex.execute { Sh.run("wm size reset; wm density reset") }
                      try { dlg?.dismiss() } catch (e: Exception) {}
                  }
                  dlg = AlertDialog.Builder(this).setMessage(t("Pertahankan pengaturan ini? Otomatis dikembalikan dalam 15 detik.|Keep this setting? It will revert automatically in 15 seconds."))
                      .setPositiveButton(t("Simpan|Keep")) { _, _ -> ui.removeCallbacks(rev) }
                      .setNegativeButton(t("Kembalikan|Revert")) { _, _ -> ui.removeCallbacks(rev); rev.run() }
                      .setCancelable(false).create()
                  dlg?.show()
                  ui.postDelayed(rev, 15000)
              }
              fun resetRes() = cmd("wm size reset; wm density reset", t("Resolusi dikembalikan|Resolution restored"))

              // ---------- navigation ----------
              fun go(i: Int) {
                  if (i < 0 || i > 3 || !Sh.ok || (i == tab && sub == "")) return
                  val d = if (i >= tab) 1 else -1
                  tab = i; sub = ""; show(d)
              }
              fun bounce(v: View) {
                  v.animate().cancel()
                  v.animate().scaleX(.86f).scaleY(.86f).setDuration(80).withEndAction {
                      v.animate().scaleX(1f).scaleY(1f).setDuration(240).setInterpolator(android.view.animation.OvershootInterpolator(3f)).start()
                  }.start()
              }
              fun buildNav() {
                  nav.removeAllViews(); navI.clear()
                  navKeys.forEachIndexed { i, k ->
                      val ic = Ico(this, k.first, P.txt)
                      val lb = tv(t(k.second), 14f, P.onAcc, true).apply { visibility = View.GONE }
                      val h = hbox().apply {
                          gravity = Gravity.CENTER
                          layoutTransition = android.animation.LayoutTransition()
                          addView(ic, lp(dp(22), dp(22)))
                          addView(lb, lp(-2, -2).apply { leftMargin = dp(8) })
                          setOnClickListener { bounce(it); go(i) }
                      }
                      nav.addView(h, lp(-2, -2, 0f, 3))
                      navI.add(Triple(h, ic, lb))
                  }
              }
              fun updateNav() {
                  navI.forEachIndexed { i, (h, ic, lb) ->
                      val sel = i == tab
                      lb.text = t(navKeys[i].second)
                      lb.visibility = if (sel) View.VISIBLE else View.GONE
                      if (sel) h.setPadding(dp(18), dp(12), dp(20), dp(12)) else h.setPadding(dp(13), dp(13), dp(13), dp(13))
                      val from = (h.tag as? Int) ?: P.card
                      val to = if (sel) P.acc else P.card
                      if (from != to) {
                          val an = android.animation.ValueAnimator.ofObject(android.animation.ArgbEvaluator(), from, to)
                          an.duration = 260
                          an.addUpdateListener { h.background = bg(it.animatedValue as Int, 40) }
                          an.start()
                      } else h.background = bg(to, 40)
                      h.tag = to
                      ic.tint(if (sel) P.onAcc else P.txt)
                  }
              }
              fun shizAlive(): Boolean = try { Shizuku.pingBinder() } catch (e: Throwable) { false }
              fun sig() = "${shizAlive()}${Sh.shizuku()}${Sh.root}$checking"
              fun startPoll() {
                  if (polling) return
                  polling = true
                  var last = sig()
                  ui.postDelayed(object : Runnable {
                      override fun run() {
                          if (isFinishing || !gateShown) { polling = false; return }
                          if (Sh.ok) { polling = false; show(); return }
                          val sg = sig()
                          if (sg != last) { last = sg; show() }
                          ui.postDelayed(this, 1200)
                      }
                  }, 1200)
              }
              fun rootCheck() {
                  checking = true; show()
                  ex.execute { Sh.checkRoot(); checking = false; ui.post { show() } }
              }
              fun gate(): View = scroll {
                  val alive = shizAlive()
                  val perm = Sh.shizuku()
                  val gc = c("#43A047"); val rc = c("#E53935")
                  val hero = FrameLayout(this@MainActivity).apply {
                      background = GradientDrawable(GradientDrawable.Orientation.TL_BR, intArrayOf(c("#5B6CFF"), c("#9B5BFF"))).apply { shape = GradientDrawable.OVAL }
                      elevation = dp(8).toFloat()
                      addView(Ico(this@MainActivity, "lock", Color.WHITE), FrameLayout.LayoutParams(dp(44), dp(44), Gravity.CENTER))
                  }
                  addView(hero, lp(dp(96), dp(96)).apply { gravity = Gravity.CENTER_HORIZONTAL; topMargin = dp(30) })
                  addView(tv(t("Akses diperlukan|Access required"), 26f, P.txt, true).apply { gravity = Gravity.CENTER }, lp().apply { topMargin = dp(20) })
                  addView(tv(t("ZenithOptimizer membutuhkan akses Shizuku atau Root. Aktifkan salah satunya untuk membuka aplikasi.|ZenithOptimizer needs Shizuku or Root access. Enable one of them to open the app."), 13f, P.sub).apply { gravity = Gravity.CENTER }, lp().apply { topMargin = dp(8) })
                  fun stRow(title: String, state: String, ok: Boolean): View = hbox().apply {
                      background = bg(P.card, 18)
                      setPadding(dp(12), dp(12), dp(14), dp(12))
                      val col = if (ok) gc else rc
                      addView(badge(if (ok) "check" else "cross", tint(col, 0x33), col), lp(dp(40), dp(40)))
                      val tx = LinearLayout(this@MainActivity).apply { orientation = LinearLayout.VERTICAL }
                      tx.addView(tv(title, 14f, P.txt, true)); tx.addView(tv(state, 12f, col))
                      addView(tx, lp(0, -2, 1f).apply { leftMargin = dp(12) })
                  }
                  if (checking) {
                      val r = hbox().apply { background = bg(P.card, 18); setPadding(dp(14), dp(14), dp(14), dp(14)) }
                      r.addView(Spin(this@MainActivity).apply { col = P.acc; start() }, lp(dp(28), dp(28)))
                      r.addView(tv(t("Memeriksa akses...|Checking access..."), 14f, P.txt, true), lp(-2, -2).apply { leftMargin = dp(12) })
                      addView(r, lp().apply { topMargin = dp(22) })
                  } else {
                      addView(stRow("Shizuku", if (perm) t("Aktif|Active") else if (alive) t("Berjalan, menunggu izin|Running, waiting for permission") else t("Tidak berjalan|Not running"), perm), lp().apply { topMargin = dp(22) })
                      addView(stRow("Root", if (Sh.root) t("Aktif|Active") else t("Belum diberikan|Not granted"), Sh.root), lp().apply { topMargin = dp(8) })
                  }
                  put(actRow("lock", t("Izinkan Shizuku|Allow Shizuku"), t("Minta izin ke Shizuku yang berjalan|Request permission from running Shizuku")) {
                      if (alive) { try { Shizuku.requestPermission(1) } catch (e: Throwable) { toast(e.message ?: "Error") } }
                      else toast(t("Shizuku belum berjalan. Nyalakan dulu.|Shizuku is not running. Start it first."))
                  })
                  put(actRow("apps", t("Buka aplikasi Shizuku|Open Shizuku app"), "moe.shizuku.privileged.api") {
                      val i = packageManager.getLaunchIntentForPackage("moe.shizuku.privileged.api")
                      if (i != null) startActivity(i) else toast(t("Aplikasi Shizuku belum terpasang|Shizuku app is not installed"))
                  })
                  put(actRow("bolt", t("Cek akses root|Check root access"), t("Minta izin su|Request su permission")) { rootCheck() })
                  put(actRow("undo", t("Periksa ulang|Re-check"), t("Segarkan status akses|Refresh access status"), true) { show() })
              }
              fun show(dir: Int = 0) {
                  if (!Sh.ok) {
                      gateShown = true
                      nav.visibility = View.GONE
                      host.removeAllViews(); host.addView(gate())
                      startPoll()
                      return
                  }
                  gateShown = false
                  nav.visibility = View.VISIBLE
                  updateNav()
                  val v = when (sub) {
                      "gfx" -> gfx()
                      "ds" -> ds()
                      else -> when (tab) { 0 -> home(); 1 -> apps(); 2 -> feat(); else -> settings() }
                  }
                  val old = if (host.childCount > 0) host.getChildAt(host.childCount - 1) else null
                  if (dir == 0 || old == null) { host.removeAllViews(); host.addView(v); return }
                  val w = (if (host.width > 0) host.width else dp(360)).toFloat() * 0.3f
                  host.addView(v)
                  v.translationX = dir * w; v.alpha = 0f
                  v.animate().translationX(0f).alpha(1f).setDuration(280).setInterpolator(android.view.animation.DecelerateInterpolator(1.6f)).start()
                  old.animate().translationX(-dir * w).alpha(0f).setDuration(200).withEndAction { host.removeView(old) }.start()
              }

