name: Build ZenithOptimizer APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate project
        run: |
          mkdir -p zo/app/src/main/java/com/lutfikreji/zenithoptimizer
          cd zo
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ZenithOptimizer"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.lutfikreji.zenithoptimizer"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.lutfikreji.zenithoptimizer"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("dev.rikka.shizuku:api:13.1.5")
              implementation("dev.rikka.shizuku:provider:13.1.5")
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <application
                  android:label="ZenithOptimizer"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar"
                  android:requestLegacyExternalStorage="true">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".BoostJob" android:exported="false"
                      android:permission="android.permission.BIND_JOB_SERVICE" />
                  <provider android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:multiprocess="false" android:enabled="true" android:exported="true"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/lutfikreji/zenithoptimizer/MainActivity.kt <<'EOF'
          package com.lutfikreji.zenithoptimizer

          import android.app.ActivityManager
          import android.app.Activity
          import android.app.AlertDialog
          import android.app.job.JobInfo
          import android.app.job.JobParameters
          import android.app.job.JobScheduler
          import android.app.job.JobService
          import android.content.ComponentName
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.SharedPreferences
          import android.content.pm.ApplicationInfo
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.RectF
          import android.graphics.Typeface
          import android.graphics.drawable.Drawable
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.text.Editable
          import android.text.InputType
          import android.text.TextWatcher
          import android.util.DisplayMetrics
          import android.util.LruCache
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.widget.*
          import rikka.shizuku.Shizuku
          import java.io.File
          import java.util.concurrent.Executors

          const val BOOST = "cmd activity kill-all; sync; echo 3 > /proc/sys/vm/drop_caches"

          object Sh {
              var root = false
              fun shizuku(): Boolean = try {
                  Shizuku.pingBinder() && Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED
              } catch (e: Throwable) { false }
              fun checkRoot(): Boolean {
                  root = try { Runtime.getRuntime().exec(arrayOf("su", "-c", "id")).waitFor() == 0 } catch (e: Throwable) { false }
                  return root
              }
              val ok: Boolean get() = root || shizuku()
              fun run(cmd: String): String = try {
                  val p: java.lang.Process = if (root) Runtime.getRuntime().exec(arrayOf("su", "-c", cmd))
                  else if (shizuku()) {
                      val m = Shizuku::class.java.getDeclaredMethod("newProcess", Array<String>::class.java, Array<String>::class.java, String::class.java)
                      m.isAccessible = true
                      m.invoke(null, arrayOf("sh", "-c", cmd), null, null) as java.lang.Process
                  } else Runtime.getRuntime().exec(arrayOf("sh", "-c", cmd))
                  val o = p.inputStream.bufferedReader().readText() + p.errorStream.bufferedReader().readText()
                  p.waitFor()
                  o.trim()
              } catch (e: Throwable) { "ERR: " + e.message }
          }

          class BoostJob : JobService() {
              override fun onStartJob(p: JobParameters?): Boolean {
                  Thread { Sh.checkRoot(); Sh.run(BOOST); jobFinished(p, false) }.start()
                  return true
              }
              override fun onStopJob(p: JobParameters?) = false
          }

          class Ico(ctx: android.content.Context, val k: String, var col: Int) : View(ctx) {
              private val p = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE; strokeWidth = 2f; strokeCap = Paint.Cap.ROUND; strokeJoin = Paint.Join.ROUND
              }
              fun tint(x: Int) { col = x; invalidate() }
              override fun onDraw(cv: Canvas) {
                  val s = minOf(width, height) / 24f
                  cv.scale(s, s)
                  p.color = col; p.style = Paint.Style.STROKE
                  fun poly(vararg f: Float) {
                      val q = Path(); q.moveTo(f[0], f[1])
                      var i = 2
                      while (i < f.size) { q.lineTo(f[i], f[i + 1]); i += 2 }
                      cv.drawPath(q, p)
                  }
                  fun solid(vararg f: Float) {
                      val q = Path(); q.moveTo(f[0], f[1])
                      var i = 2
                      while (i < f.size) { q.lineTo(f[i], f[i + 1]); i += 2 }
                      q.close(); p.style = Paint.Style.FILL_AND_STROKE; cv.drawPath(q, p); p.style = Paint.Style.STROKE
                  }
                  fun ln(a: Float, b: Float, x: Float, y: Float) = cv.drawLine(a, b, x, y, p)
                  fun rr(a: Float, b: Float, x: Float, y: Float, r: Float) = cv.drawRoundRect(RectF(a, b, x, y), r, r, p)
                  fun ring(x: Float, y: Float, r: Float) = cv.drawCircle(x, y, r, p)
                  fun dot(x: Float, y: Float, r: Float) { p.style = Paint.Style.FILL; cv.drawCircle(x, y, r, p); p.style = Paint.Style.STROKE }
                  when (k) {
                      "home" -> { poly(3f, 11f, 12f, 3f, 21f, 11f); poly(5f, 9.5f, 5f, 20f, 19f, 20f, 19f, 9.5f); poly(10f, 20f, 10f, 14f, 14f, 14f, 14f, 20f) }
                      "apps" -> { rr(3f, 3f, 10.5f, 10.5f, 2.5f); rr(13.5f, 3f, 21f, 10.5f, 2.5f); rr(3f, 13.5f, 10.5f, 21f, 2.5f); rr(13.5f, 13.5f, 21f, 21f, 2.5f) }
                      "tune" -> for ((x, y) in listOf(6f to 12f, 12f to 7f, 18f to 15f)) { ln(x, 4f, x, y - 3.5f); ln(x, y + 3.5f, x, 20f); ring(x, y, 2.5f) }
                      "gear" -> {
                          ring(12f, 12f, 3f); ring(12f, 12f, 7f)
                          for (i in 0..7) {
                              val a = Math.toRadians(i * 45.0); val cx = Math.cos(a).toFloat(); val sy = Math.sin(a).toFloat()
                              ln(12f + 7f * cx, 12f + 7f * sy, 12f + 10f * cx, 12f + 10f * sy)
                          }
                      }
                      "sun" -> {
                          ring(12f, 12f, 4f)
                          for (i in 0..7) {
                              val a = Math.toRadians(i * 45.0); val cx = Math.cos(a).toFloat(); val sy = Math.sin(a).toFloat()
                              ln(12f + 6.8f * cx, 12f + 6.8f * sy, 12f + 9.5f * cx, 12f + 9.5f * sy)
                          }
                      }
                      "power" -> { cv.drawArc(RectF(5f, 5f, 19f, 19f), -60f, 300f, false, p); ln(12f, 3f, 12f, 12f) }
                      "bolt" -> solid(13f, 2.5f, 5f, 13.5f, 11f, 13.5f, 10f, 21.5f, 19f, 10f, 13f, 10f)
                      "battery" -> { rr(2f, 7f, 19.5f, 17f, 2.5f); ln(22f, 10.5f, 22f, 13.5f); p.style = Paint.Style.FILL; cv.drawRoundRect(RectF(4.5f, 9.5f, 12f, 14.5f), 1f, 1f, p) }
                      "gauge" -> { cv.drawArc(RectF(3f, 5f, 21f, 23f), 180f, 180f, false, p); ln(12f, 14f, 16.5f, 9.5f); dot(12f, 14f, 1.6f) }
                      "check" -> poly(5f, 12.5f, 10f, 17.5f, 19f, 7f)
                      "cross" -> { ln(6f, 6f, 18f, 18f); ln(18f, 6f, 6f, 18f) }
                      "info" -> { ring(12f, 12f, 9f); ln(12f, 11f, 12f, 17f); dot(12f, 7.6f, 1.2f) }
                      "back" -> { ln(19f, 12f, 5f, 12f); poly(11f, 6f, 5f, 12f, 11f, 18f) }
                      "chev" -> poly(9f, 5f, 16f, 12f, 9f, 19f)
                      "trash" -> { ln(4f, 7f, 20f, 7f); poly(9f, 7f, 9f, 4f, 15f, 4f, 15f, 7f); poly(6f, 7f, 7f, 20f, 17f, 20f, 18f, 7f); ln(10f, 11f, 10f, 16f); ln(14f, 11f, 14f, 16f) }
                      "pad" -> { rr(2f, 6.5f, 22f, 17.5f, 5.5f); ln(6f, 12f, 10f, 12f); ln(8f, 10f, 8f, 14f); dot(15.5f, 10.8f, 1.3f); dot(18f, 13.2f, 1.3f) }
                      "scale" -> { rr(3f, 3f, 21f, 21f, 3f); rr(3f, 10f, 14f, 21f, 2.5f) }
                      "clock" -> { ring(12f, 12f, 9f); poly(12f, 7f, 12f, 12f, 15.5f, 14f) }
                      "dnd" -> { ring(12f, 12f, 9f); ln(8f, 12f, 16f, 12f) }
                      "play" -> solid(8f, 5f, 19f, 12f, 8f, 19f)
                      "screen" -> { rr(3f, 4f, 21f, 16f, 2.5f); ln(8f, 20f, 16f, 20f); ln(12f, 16f, 12f, 20f) }
                      "globe" -> { ring(12f, 12f, 9f); ln(3f, 12f, 21f, 12f); cv.drawOval(RectF(8f, 3f, 16f, 21f), p) }
                      "share" -> { ring(18f, 5f, 3f); ring(6f, 12f, 3f); ring(18f, 19f, 3f); ln(8.7f, 10.6f, 15.3f, 6.4f); ln(8.7f, 13.4f, 15.3f, 17.6f) }
                      "undo" -> {
                          poly(9f, 4f, 4f, 9f, 9f, 14f)
                          val q = Path(); q.moveTo(4f, 9f); q.lineTo(14f, 9f); q.quadTo(20f, 9f, 20f, 14f); q.quadTo(20f, 19f, 14f, 19f); q.lineTo(8f, 19f)
                          cv.drawPath(q, p)
                      }
                      "wave" -> {
                          val q = Path(); q.moveTo(2f, 12f); q.quadTo(6f, 3f, 10f, 12f); q.quadTo(14f, 21f, 18f, 12f); q.lineTo(22f, 12f)
                          cv.drawPath(q, p)
                      }
                      "lock" -> { rr(5f, 11f, 19f, 21f, 3f); cv.drawArc(RectF(8f, 4f, 16f, 12f), 180f, 180f, false, p); ln(8f, 8f, 8f, 11f); ln(16f, 8f, 16f, 11f); dot(12f, 16f, 1.4f) }
                      else -> {}
                  }
              }
          }

          class Spin(ctx: android.content.Context) : View(ctx) {
              var mode = 0
              var col = 0
              var okC = 0
              var errC = 0
              private var ang = 0f
              private var prog = 0f
              private var spin: android.animation.ValueAnimator? = null
              private val p = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE; strokeCap = Paint.Cap.ROUND; strokeJoin = Paint.Join.ROUND }
              fun start() {
                  mode = 0; spin?.cancel()
                  spin = android.animation.ValueAnimator.ofFloat(0f, 360f).apply {
                      duration = 900; repeatCount = android.animation.ValueAnimator.INFINITE
                      interpolator = android.view.animation.LinearInterpolator()
                      addUpdateListener { ang = it.animatedValue as Float; invalidate() }
                      start()
                  }
              }
              fun finish(ok: Boolean) {
                  spin?.cancel(); mode = if (ok) 1 else 2; prog = 0f
                  android.animation.ValueAnimator.ofFloat(0f, 1f).apply {
                      duration = 450; interpolator = android.view.animation.DecelerateInterpolator()
                      addUpdateListener { prog = it.animatedValue as Float; invalidate() }
                      start()
                  }
              }
              override fun onDetachedFromWindow() { spin?.cancel(); super.onDetachedFromWindow() }
              private fun poly(cv: Canvas, pr: Float, vararg f: Float) {
                  var tot = 0f
                  var i = 0
                  while (i < f.size - 2) { tot += Math.hypot((f[i + 2] - f[i]).toDouble(), (f[i + 3] - f[i + 1]).toDouble()).toFloat(); i += 2 }
                  var rem = tot * pr
                  i = 0
                  while (i < f.size - 2 && rem > 0f) {
                      val len = Math.hypot((f[i + 2] - f[i]).toDouble(), (f[i + 3] - f[i + 1]).toDouble()).toFloat()
                      val k = minOf(1f, rem / len)
                      cv.drawLine(f[i], f[i + 1], f[i] + (f[i + 2] - f[i]) * k, f[i + 1] + (f[i + 3] - f[i + 1]) * k, p)
                      rem -= len; i += 2
                  }
              }
              override fun onDraw(cv: Canvas) {
                  val s = minOf(width, height).toFloat()
                  p.strokeWidth = s / 12f
                  val r = RectF(s * .12f, s * .12f, s * .88f, s * .88f)
                  if (mode == 0) {
                      p.color = (0x33 shl 24) or (col and 0xFFFFFF); cv.drawArc(r, 0f, 360f, false, p)
                      p.color = col; cv.drawArc(r, ang, 110f, false, p)
                  } else {
                      p.color = if (mode == 1) okC else errC
                      cv.drawArc(r, -90f, 360f * prog, false, p)
                      if (mode == 1) poly(cv, prog, s * .3f, s * .52f, s * .44f, s * .66f, s * .71f, s * .36f)
                      else { poly(cv, prog, s * .36f, s * .36f, s * .64f, s * .64f); poly(cv, prog, s * .64f, s * .36f, s * .36f, s * .64f) }
                  }
              }
          }

          class Pal(val bg: Int, val card: Int, val inner: Int, val txt: Int, val sub: Int, val acc: Int, val onAcc: Int)
          fun c(s: String) = Color.parseColor(s)
          val DK by lazy { Pal(c("#0B0D12"), c("#14171D"), c("#1D212A"), c("#FFFFFF"), c("#9AA0AA"), c("#C3C9FA"), c("#1B2250")) }
          val LT by lazy { Pal(c("#F4F5FA"), c("#FFFFFF"), c("#E8EBF4"), c("#101318"), c("#5C6370"), c("#3F51B5"), c("#FFFFFF")) }
          data class AppI(val label: String, val pkg: String, val game: Boolean)

          class MainActivity : Activity() {
              lateinit var sp: SharedPreferences
              lateinit var host: FrameLayout
              lateinit var nav: LinearLayout
              lateinit var P: Pal
              var tab = 0
              var sub = ""
              var lang = "id"
              var pw = 0; var ph = 0; var pd = 0
              val ex = Executors.newSingleThreadExecutor()
              val ui = Handler(Looper.getMainLooper())
              val icons = LruCache<String, Drawable>(300)
              var dlg: AlertDialog? = null
              lateinit var rootL: FrameLayout
              var checking = true
              var gateShown = false
              var polling = false
              var angle = 0
              var angleInfo = ""
              var angleBusy = false
              var swX = 0f
              var swY = 0f
              var noSwipe = false
              var swiping = false
              var ov: FrameLayout? = null
              var ovSpin: Spin? = null
              var ovTxt: TextView? = null
              val navI = ArrayList<Triple<LinearLayout, Ico, TextView>>()
              val navKeys = listOf("home" to "Beranda|Home", "apps" to "Aplikasi|Apps", "tune" to "Fitur|Features", "gear" to "Pengaturan|Settings")

              fun t(s: String): String { val a = s.split("|"); return if (lang == "en") a[1] else a[0] }
              fun dark(): Boolean = when (sp.getString("theme", "system")) {
                  "dark" -> true
                  "light" -> false
                  else -> (resources.configuration.uiMode and 0x30) == 0x20
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  sp = getSharedPreferences("p", MODE_PRIVATE)
                  lang = sp.getString("lang", "id")!!
                  tab = sp.getInt("rt", 0); sp.edit().putInt("rt", 0).apply()
                  P = if (dark()) DK else LT
                  window.statusBarColor = P.bg
                  window.navigationBarColor = P.bg
                  if (!dark()) window.decorView.systemUiVisibility = 0x2010
                  val root = FrameLayout(this).apply { setBackgroundColor(P.bg) }
                  rootL = root
                  host = FrameLayout(this)
                  root.addView(host, FrameLayout.LayoutParams(-1, -1))
                  nav = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      background = bg(P.inner, 40)
                      setPadding(dp(8), dp(8), dp(8), dp(8))
                      elevation = dp(8).toFloat()
                      layoutTransition = android.animation.LayoutTransition().apply { enableTransitionType(android.animation.LayoutTransition.CHANGING) }
                  }
                  root.addView(nav, FrameLayout.LayoutParams(-2, -2, Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL).apply { bottomMargin = dp(26) })
                  setContentView(root)
                  buildNav()
                  ex.execute { Sh.checkRoot(); checking = false; ui.post { if (gateShown || (tab == 0 && sub == "")) show() } }
                  show()
              }

              override fun onResume() { super.onResume(); if (::host.isInitialized && (!Sh.ok || (tab == 0 && sub == ""))) show() }
              override fun onBackPressed() { if (sub != "") { sub = ""; show(-1) } else super.onBackPressed() }

              fun hit(v: View, x: Int, y: Int): Boolean {
                  if (v.visibility != View.VISIBLE) return false
                  val r = android.graphics.Rect()
                  if (!v.getGlobalVisibleRect(r) || !r.contains(x, y)) return false
                  if (v is SeekBar || v is HorizontalScrollView || v is EditText) return true
                  if (v is ViewGroup) for (i in 0 until v.childCount) if (hit(v.getChildAt(i), x, y)) return true
                  return false
              }

              override fun dispatchTouchEvent(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          swX = e.rawX; swY = e.rawY; swiping = false
                          noSwipe = ov != null || gateShown || sub != "" || hit(window.decorView, e.rawX.toInt(), e.rawY.toInt())
                      }
                      MotionEvent.ACTION_MOVE -> if (!noSwipe && !swiping) {
                          val dx = e.rawX - swX; val dy = e.rawY - swY
                          if (Math.abs(dx) > dp(24) && Math.abs(dx) > Math.abs(dy) * 2) {
                              swiping = true
                              val cn = MotionEvent.obtain(e); cn.action = MotionEvent.ACTION_CANCEL
                              super.dispatchTouchEvent(cn); cn.recycle()
                          }
                      }
                      MotionEvent.ACTION_UP -> if (swiping) {
                          swiping = false
                          val dx = e.rawX - swX
                          if (Math.abs(dx) > dp(90)) go(if (dx < 0) tab + 1 else tab - 1)
                          return true
                      }
                      MotionEvent.ACTION_CANCEL -> swiping = false
                  }
                  if (swiping) return true
                  return super.dispatchTouchEvent(e)
              }

              override fun onActivityResult(rc: Int, res: Int, d: Intent?) {
                  super.onActivityResult(rc, res, d)
                  if (rc != 7 || res != RESULT_OK) return
                  val u = d?.data ?: return
                  try {
                      val o = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                      contentResolver.openInputStream(u)?.use { BitmapFactory.decodeStream(it, null, o) }
                      o.inSampleSize = maxOf(1, o.outWidth / 1200); o.inJustDecodeBounds = false
                      val bm = contentResolver.openInputStream(u)?.use { BitmapFactory.decodeStream(it, null, o) }
                      File(filesDir, "banner.jpg").outputStream().use { bm!!.compress(Bitmap.CompressFormat.JPEG, 88, it) }
                      show()
                  } catch (e: Exception) { toast("Error: " + e.message) }
              }

              // ---------- helpers ----------
              fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
              fun bg(col: Int, r: Int = 20) = GradientDrawable().apply { setColor(col); cornerRadius = dp(r).toFloat() }
              fun tv(s: String, sz: Float = 14f, col: Int = P.txt, b: Boolean = false) = TextView(this).apply {
                  text = s; textSize = sz; setTextColor(col); if (b) setTypeface(null, Typeface.BOLD)
              }
              fun lp(w: Int = -1, h: Int = -2, wt: Float = 0f, m: Int = 0) =
                  LinearLayout.LayoutParams(w, h, wt).apply { setMargins(dp(m), dp(m), dp(m), dp(m)) }
              fun vbox(col: Int = P.card, pad: Int = 16, r: Int = 24) = LinearLayout(this).apply {
                  orientation = LinearLayout.VERTICAL; background = bg(col, r); setPadding(dp(pad), dp(pad), dp(pad), dp(pad))
              }
              fun hbox() = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL }
              fun btn(s: String, sel: Boolean = false, f: () -> Unit) = TextView(this).apply {
                  text = s; gravity = Gravity.CENTER; textSize = 13f
                  setPadding(dp(14), dp(10), dp(14), dp(10))
                  setTextColor(if (sel) P.onAcc else P.txt)
                  background = bg(if (sel) P.acc else P.inner, 50)
                  setOnClickListener { f() }
              }
              fun sec(s: String) = tv(s, 13f, P.acc, true)
              fun chip(s: String, fg: Int) = tv(s, 11f, fg, true).apply {
                  setPadding(dp(10), dp(3), dp(10), dp(3)); background = bg((0x33 shl 24) or (fg and 0xFFFFFF), 50)
              }
              fun toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_SHORT).show()
              fun scroll(b: LinearLayout.() -> Unit): View {
                  val col = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(16), dp(48), dp(16), dp(120)) }
                  col.b()
                  return ScrollView(this).apply { addView(col) }
              }
              fun LinearLayout.put(v: View) { addView(v, lp().apply { topMargin = dp(12) }) }
              fun tint(col: Int, a: Int = 0x26) = (a shl 24) or (col and 0xFFFFFF)
              fun badge(k: String, bgc: Int, fg: Int, size: Int = 40, ic: Int = 20): View = FrameLayout(this).apply {
